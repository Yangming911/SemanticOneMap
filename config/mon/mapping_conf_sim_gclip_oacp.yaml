MappingConf: # Dual-model: ConvNeXt for navigation + GCLIP with GT ACI calibration
  n_points: 600
  size: 60
  agent_radius: 0.2
  blur_kernel_size: 0.05
  obstacle_map_threshold: 0.4
  fully_explored_threshold: 0.2
  checked_map_threshold: 0.2
  depth_factor: 0.01
  gradient_factor: 0.2
  optimal_object_distance: 1.0
  optimal_object_factor: 1.5
  obstacle_min: -0.6
  obstacle_max: 0.5
  filter_stairs: True
  floor_level: -0.88
  floor_threshold: -1.1
  clip_model_type: convnext
  use_gclip_for_obstacles: True
  use_clip_semantic_nav_map: False
  clip_semantic_sim_threshold: 0.0
  use_yolo_obstacle_map: False
  yolo_window_size: 50
  use_clip_cp_obstacle_map: True      # Enable CLIP-CP obstacle map
  clip_cp_threshold: 0.25             # Initial τ (similarity threshold)
  clip_cp_use_oacp: True              # Enable ACI real-time calibration
  clip_cp_target_coverage: 0.9       # Target coverage = 1 - α_target
  clip_cp_window_size: 200
  clip_cp_gamma: 0.05                 # ACI step size
  clip_cp_initial_alpha: 0.5          # Conservative initial α
